# 本地开发：挂载根目录 MPA；改 HTML/CSS/JS 后刷新即可，无需 compose build。无 Docker 时也可用仓库根 make serve-reader → http://127.0.0.1:8000/（与 8765 错开）。全站 SPA 用 cd spa && npm run dev。
# 改根 .html / docs 后维护 SPA public：make spa-sync；docs/MERGE_AND_RELEASE_CHECKLIST.md#pre-merge · #pre-merge-partials-sequence · maintainer-hub.html#mh-spine-map · #mh-boundaries · #mh-reader-admin-matrix
# 用法：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
# 只读 API（可选）：docker compose -f docker-compose.dev.yml --profile api up -d
# 管理端脚手架（可选）：docker compose -f docker-compose.dev.yml --profile admin up -d
services:
  web:
    build: .
    image: ai-arch-evolution:local
    ports:
      - "8765:80"
    volumes:
      - .:/www:ro
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  readonly-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile.readonly-api
    image: ai-arch-evolution:api
    ports:
      - "8099:8099"
    volumes:
      - .:/srv:ro
    working_dir: /srv
    environment:
      PYTHONPATH: /srv/scripts
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "readonly_api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8099",
      ]
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  admin-console:
    profiles: ["admin"]
    build:
      context: ./admin-console
      dockerfile: Dockerfile
    image: ai-arch-evolution:admin
    ports:
      - "8100:8100"
    environment:
      READONLY_API_BASE_URL: ${READONLY_API_BASE_URL-http://readonly-api:8099}
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
