# 本地开发：挂载源码目录，改 HTML/CSS/JS 后刷新浏览器即可，无需 docker compose build。
# 用法：docker compose -f docker-compose.dev.yml up -d
# 停止：docker compose -f docker-compose.dev.yml down
services:
  web:
    build: .
    image: ai-arch-evolution:local
    ports:
      - "8765:80"
    volumes:
      - .:/www:ro
    restart: "no"
