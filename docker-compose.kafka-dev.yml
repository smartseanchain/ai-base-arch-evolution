# 可选：本地 Kafka 协议兼容栈（Redpanda 单节点 + Console）。
# 与默认站点栈（docker-compose.yml）独立；不进入 CI、不替代 Git JSON 真源。
# 用法与组件说明见 docs/ORCHESTRATION_AND_EVENT_STREAMING.md §3.3—3.4。
#
#   docker compose -f docker-compose.kafka-dev.yml up -d
#   或：make docker-up-kafka-dev
#
# 宿主机连接：Kafka API localhost:19092；Schema Registry http://localhost:18081
# Console UI：http://localhost:8888

name: ai-arch-evolution-kafka-dev

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0:

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.11
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --advertise-schema-registry-addr
      - internal://redpanda-0:8081,external://localhost:18081
      - --rpc-addr
      - redpanda-0:33145
      - --advertise-rpc-addr
      - redpanda-0:33145
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --default-log-level=info
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"

  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "8888:8080"
    depends_on:
      - redpanda-0
