# 仅抓取候选（需外网）；与「分析流水线」解耦。产出 candidates 以 artifact 下载，默认不回写仓库。
# 候选≠已审 manifest：人审与 PR 闸门见 AGENTS.md#agents-invariants。
# 本地同等命令：bash scripts/run_ingest_only.sh  或  make ingest
# WRITE_INGEST_SUMMARY=1 时额外写入 ingest-summary.json 并写入 GitHub Job Summary。
# 全站呈现双轨 / merge / 枢纽：docs/MERGE_AND_RELEASE_CHECKLIST.md#pre-merge · #pre-merge-partials-sequence · maintainer-hub.html#mh-spine-map · #mh-boundaries · #mh-reader-admin-matrix · make help（CONTRIBUTING.md#contributing-five-minute · #contributing-pr-evidence-triad · #contributing-change-to-command）
name: Ingest candidates

on:
  workflow_dispatch:
  schedule:
    # 每周二 08:00 UTC（与周一分析流水线错开）；见 https://crontab.guru
    - cron: "0 8 * * 2"

env:
  WRITE_INGEST_SUMMARY: "1"

concurrency:
  group: ingest-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ingest and validate candidates
        id: ingest
        run: bash scripts/run_ingest_only.sh
      - name: Job summary
        if: always()
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          out = os.environ.get("GITHUB_STEP_SUMMARY")
          p = Path("ingest-summary.json")
          lines = ["## Ingest candidates", ""]
          if p.is_file():
              d = json.loads(p.read_text(encoding="utf-8"))
              lines.append(f"- **signals_count**: {d.get('signals_count')}")
              lines.append(f"- **require_route_match**: {d.get('require_route_match')}")
              lines.append("")
              lines.append("| 源 | 状态 | 条目数 | 错误 |")
              lines.append("|---|---|---:|---|")
              for f in d.get("feeds") or []:
                  ok = f.get("ok")
                  st = "ok" if ok else "**failed**"
                  err = (f.get("error") or "").replace("|", "\\|")[:200]
                  lines.append(
                      f"| `{f.get('id')}` | {st} | {f.get('items_fetched', 0)} | {err or '—'} |"
                  )
              for lp in d.get("law_pages") or []:
                  ok = lp.get("ok")
                  st = "ok" if ok else "**failed**"
                  err = (lp.get("error") or "").replace("|", "\\|")[:200]
                  lines.append(
                      f"| law `{lp.get('id')}` | {st} | — | {err or '—'} |"
                  )
          else:
              lines.append("_未生成 ingest-summary.json（抓取可能在写入摘要前失败）_")
          text = "\n".join(lines) + "\n"
          if out:
              Path(out).write_text(text, encoding="utf-8")
          else:
              print(text)
          PY
      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-candidates-${{ github.run_id }}
          path: |
            assets/evolution-candidates.json
            ingest-summary.json
          if-no-files-found: warn

  # 仅定时任务失败时开 Issue，避免手动调试时刷屏（仍可在 Summary 查看）
  notify-schedule-failure:
    needs: [ingest]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `[ingest] 定时抓取失败 · ${new Date().toISOString().slice(0, 10)}`;
            const body = `定时 ingest 失败。请查看 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 与 Job Summary。\n\n若为源站临时故障可关闭本 issue；连续失败请检查 \`scripts/ingest_config.json\` 中 RSS URL。`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
