# 定时或手动跑分析流水线，产出 JSON 以 artifact 下载（默认不回写仓库）。
# 本地同等命令：bash scripts/run_update_pipeline.sh
name: Update pipeline

on:
  workflow_dispatch:
  schedule:
    # 每周一 16:00 UTC（约北京时间周一夜间）；可按需改 crontab.guru
    - cron: "0 16 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run update pipeline
        run: bash scripts/run_update_pipeline.sh
      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs-${{ github.run_id }}
          path: |
            assets/analysis-snapshot.json
            assets/sediment-trends.json
            data/sediment.json
          if-no-files-found: warn

  # 与 ingest-pipeline 对称：仅定时失败时开 Issue，避免手动调试刷屏
  notify-schedule-failure:
    needs: [analyze]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `[analyze] 定时分析流水线失败 · ${new Date().toISOString().slice(0, 10)}`;
            const body = `定时 **Update pipeline** 失败。请查看 [运行日志](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})。\n\n常见原因：manifest/候选校验失败、Python 脚本异常、写入路径权限。本地对照：\`bash scripts/run_update_pipeline.sh\`。\n\n修复后关闭本 issue；若为上游临时故障可注明后关闭。`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
