# 在仓库根目录初始化 git 并 push 后生效。仅校验 JSON，不写回 assets/。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check Python scripts
        run: python3 -m compileall -q scripts
      - name: Unit tests (scripts/tests)
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate evolution JSON
        run: |
          python3 scripts/validate-evolution-manifest.py
          python3 scripts/validate-evolution-candidates.py
      - name: Manifest vs pages / lab factors drift check
        run: python3 scripts/check_manifest_drift.py
      - name: Analysis engine dry check
        run: python3 scripts/analysis_engine.py --check
