# 在仓库根目录初始化 git 并 push 后生效。仅校验 JSON，不写回 assets/。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full validate (compileall + JSON + drift + nav + tests + analysis + snapshot)
        run: bash scripts/run_validate.sh
